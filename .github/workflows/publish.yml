name: Publish

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[A-Za-z0-9]+-service-[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get service name and version
        id: service
        run: |
          echo "service=$(echo ${{ github.ref }} | cut -d '/' -f 3 | cut -d '-' -f 1-2)" >> $GITHUB_OUTPUT
          echo "version=$(echo ${{ github.ref }} | cut -d '/' -f 3 | cut -d '-' -f 3)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.service.outputs.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.service.outputs.service }}:${{ steps.service.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.service.outputs.service }}:latest

      - name: Generate SBOM with Syft
        env:
          IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.service.outputs.service }}:${{ steps.service.outputs.version }}
        run: docker run --rm anchore/syft:latest "$IMAGE_REF" -o cyclonedx-json > sbom.cdx.json

      - name: Scan SBOM with Grype
        run: |
          docker run --rm -v "$PWD:/work" anchore/grype:latest "sbom:/work/sbom.cdx.json" -o sarif > results.sarif
          docker run --rm -v "$PWD:/work" anchore/grype:latest "sbom:/work/sbom.cdx.json" --fail-on high

      - name: Upload SBOM and scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-and-security-scan
          if-no-files-found: warn
          path: |
            sbom.cdx.json
            results.sarif

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        with:
          sarif_file: results.sarif
